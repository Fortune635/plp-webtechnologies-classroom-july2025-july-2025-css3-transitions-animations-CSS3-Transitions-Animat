<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Web Experience</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Welcome to the Interactive Web Experience!</h1>
        <button id="themeToggle" class="btn">Toggle Dark Mode</button>
    </header>

    <!-- Section 1: Animated Box -->
    <section>
        <h2>Animated Box</h2>
        <button class="btn" onclick="toggleAnimation('animatedBox')">Animate Box</button>
        <div id="animatedBox" class="box"></div>
    </section>

    <!-- Section 2: Flip Card -->
    <section>
        <h2>Flip Card</h2>
        <div class="card" id="flipCard" onclick="flipCard('flipCard')">
            <div class="card-inner">
                <div class="card-front">Front</div>
                <div class="card-back">Back</div>
            </div>
        </div>
    </section>

    <!-- Section 3: Loader -->
    <section>
        <h2>Loader</h2>
        <button class="btn" onclick="toggleLoader('loader')">Toggle Loader</button>
        <div id="loader" class="loader"></div>
    </section>

    <!-- Section 4: Modal -->
    <section>
        <h2>Modal Popup</h2>
        <button class="btn" onclick="showModal('modal')">Show Modal</button>
        <div id="modal" class="modal">
            <div class="modal-content">
                <span class="close" onclick="hideModal('modal')">&times;</span>
                <p>This is a dynamic modal!</p>
            </div>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
